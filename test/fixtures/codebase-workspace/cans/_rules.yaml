# Issue #66 fixture — the codebase inbound-references scanner, ON.
#
# Layout note: this directory is the PROJECT ROOT (the parent of the cans/
# workspace), so `codebase.roots` resolves from here and `src/` joins the
# scan while `cans/` itself is always skipped. `references.back_pointers`
# stays false so the corpus's hub refs (every numbered file sees
# 00-overview.md) need no ref-by comments — the corpus must check clean so
# the suite's exit codes isolate the codebase band.
references:
  back_pointers: false
  # Issue #68 (the kelir plugin tier): the three cans/plugins/*.md specs are
  # NOT corpus files (discovery takes root-level .md and index.md only), so
  # they join the checked set the way kelir's do — through the issue #65
  # plugin tier: `references.aliasing.include` names them by workspace-
  # relative glob (`plugins/*.md` — the spelling the #65 refusal hint and
  # kelir's own _rules.yaml use), aliasing enabled gates the tier. The tier
  # is refs-only (no structure/style/redundancy checks on plugin files) and
  # their refs join the graph, exactly the preconditions the kelir five
  # assume: `cans/plugins/db-proxy.md` is a RESOLVABLE key for the codebase
  # scanner, so a broken pointer there is AnchorNotFound, never FileNotFound.
  aliasing:
    enabled: true
    include:
      - plugins/*.md

# Issue #67 (the kelir-shaped extension): the extension is verbatim where
# the issue is verbatim and the pre-#67 corpus is frozen, so the
# mini-corpus reuses function words and near-form words by construction —
# the kelir headings alone push "on" to four nodes, and collide at
# exactly the typo layer's default distance (native↔active, rewrite↔
# write — Levenshtein 2, the issue #47 false-positive class). A warning
# there would muddy the exit-code bands this fixture isolates, so the §18
# knobs carry one notch of word-frequency headroom and turn the near-miss
# layer off; every other redundancy layer stays on and the corpus
# remains check-clean.
redundancy:
  word_frequency_threshold: 5
  fuzzy: false

codebase:
  enabled: true
  roots: ["."]
  # The RFC §3 default include list, spelled out verbatim — plus ONE
  # deliberate extra, **/*.yaml, which brings the YAML-comment variant
  # (src/net.yaml) into the scan; the pure default set (what the
  # `cans check --codebase` flag-on-without-config run uses) covers only the
  # seven code extensions below and does NOT scan src/net.yaml.
  include:
    - "**/*.rs"
    - "**/*.ts"
    - "**/*.js"
    - "**/*.py"
    - "**/*.go"
    - "**/*.c"
    - "**/*.cpp"
    - "**/*.yaml"
  # The RFC §3 default exclude list, spelled out verbatim.
  exclude:
    - "**/target/**"
    - "**/node_modules/**"
    - "**/.git/**"
    - "**/dist/**"
  severity: error
